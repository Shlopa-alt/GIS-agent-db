# Непрерывная проверка: установка базы с нуля и прогон всех проверок.
#
# Второе важнее первого. Проверки и так запускаются на рабочей машине, а вот
# «ставится ли база с нуля» там не проверить ничем: живая база накапливалась
# месяц, роли завели руками, миграции 001-014 зарегистрировали задним числом.
# Здесь каждый раз поднимается пустой Postgres, создаются роли, накатываются
# все миграции по порядку и прогоняются проверки — то есть проверяется ровно
# то, что будет делать покупатель при установке.
#
# Пароли здесь заведомо негодные: это одноразовый контейнер, живущий минуты.
# Пароли рабочей базы лежат в хранилище (secrets/*.pw) и в репозиторий не
# попадают.

name: проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  без-базы:
    name: без базы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: проверки, не требующие базы
        # База недоступна: часть проверок пропускается — так репозиторий
        # собирается на машине без базы. Недоступность выясняется один раз
        # (tests/conftest.py), иначе прогон упирался бы в отказы по 10 секунд.
        env:
          GIS_DB_HOST: 127.0.0.1
          GIS_DB_PORT: "1"
        run: pytest tests -q

  с-базой:
    name: установка с нуля и все проверки
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GIS_DB_HOST: 127.0.0.1
      GIS_DB_PORT: "5432"
      GIS_DB_NAME: gis_au_u
      GIS_DB_ROOT: /tmp/gis-db-ci
      # Пароль суперпользователя контейнера. Пароли ролей базы здесь НЕ
      # задаются переменными: их придумывает установщик и кладёт в хранилище —
      # ровно так это будет у покупателя. Переменные бы это подменили, и
      # установщик проверялся бы наполовину.
      GIS_DB_SUPER_PASSWORD: ci-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: установка с нуля одной командой
        # Главная проверка этой работы: пустой сервер → роли, база, расширения,
        # схема, сверка. Всё, что установщик не умеет, здесь и обнаружится.
        run: python db/install.py --суперпользователь postgres

      - name: повторный запуск ничего не ломает
        # Установку запускают дважды чаще, чем кажется: после обрыва связи,
        # после «а точно получилось?». Второй раз обязан быть безвредным.
        run: python db/install.py --суперпользователь postgres

      - name: учёт миграций сошёлся
        run: |
          python db/migrate.py --состояние | tee учёт.txt
          grep -q "ожидает: 0" учёт.txt

      - name: повторный накат ничего не делает
        # Идемпотентность: второй запуск обязан не найти работы. Иначе учёт
        # миграций не учёт, а журнал пожеланий.
        run: |
          python db/migrate.py | tee повтор.txt
          grep -q "применять нечего" повтор.txt

      - name: пароль роли человека
        # gis_human создаёт миграция 007, и создаёт без пароля — иначе пароль
        # лежал бы в репозитории. Панели он нужен, поэтому задаётся после.
        run: python db/set_password.py gis_human

      - name: учётная запись проверяющего
        # Заодно проверяется вход в панель: проверки панели входят настоящим
        # паролем роли, а не подделанным печеньем.
        run: |
          python db/add_reviewer.py --кто ci_reviewer --подпись "Проверка сборки"
          python db/add_reviewer.py --список

      - name: все проверки
        run: pytest tests -q
